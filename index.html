<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目指标看板 · 集成测试</title>
<style>
:root[data-theme="dark"]{
  --bg:#1b1310; --glow1:rgba(255,146,64,.20); --glow2:rgba(255,205,130,.12);
  --panel:rgba(255,255,255,.055); --panel-hi:rgba(255,214,178,.10);
  --border:rgba(255,203,163,.15); --border-hi:rgba(255,203,163,.34);
  --text:#faeadc; --dim:#c3a489; --faint:#8f7563;
  --accent:#ff9c4a; --ok:#68d29a; --warn:#ffc552; --bad:#ff8a7a; --info:#cfa6f5;
  --track:rgba(255,203,163,.15); --tipbg:rgba(43,27,20,.97);
  --shadow:0 10px 34px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --bg:#ffffff; --glow1:rgba(255,152,72,.09); --glow2:rgba(255,208,138,.07);
  --panel:#ffffff; --panel-hi:#fff3e8;
  --border:rgba(200,120,58,.20); --border-hi:rgba(200,120,58,.42);
  --text:#4b2f21; --dim:#9d7b64; --faint:#c4a690;
  --accent:#f07d1a; --ok:#1f9d68; --warn:#b8770a; --bad:#dc5252; --info:#8a5cc7;
  --track:rgba(200,120,58,.14); --tipbg:rgba(255,255,255,.99);
  --shadow:0 10px 30px rgba(92,70,56,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 12% -8%,var(--glow1),transparent 62%),
                   radial-gradient(800px 460px at 92% 4%,var(--glow2),transparent 60%);
  background-attachment:fixed;
  transition:background-color .25s ease,color .25s ease;
}
.wrap{max-width:1560px;margin:0 auto;padding:22px 26px 56px}

/* ---------- 顶部 ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:19px;font-weight:650;letter-spacing:-.2px}
h1 .dot{color:var(--accent)}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:var(--panel);border:1px solid var(--border);font-size:11.5px;color:var(--dim);
  backdrop-filter:blur(12px);white-space:nowrap;cursor:default;
}
.pill b{color:var(--text);font-weight:600}
.pill.link{cursor:pointer;text-decoration:none}
.pill.link:hover{border-color:var(--border-hi);color:var(--text)}
.tbtn{
  padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--border);
  color:var(--dim);font-size:11.5px;cursor:pointer;backdrop-filter:blur(12px);
  font-family:inherit;transition:.15s;
}
.tbtn:hover{border-color:var(--border-hi);color:var(--text)}

/* ---------- 状态灯条 ---------- */
.strip{
  display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--border);
  background:var(--panel);backdrop-filter:blur(14px);margin-bottom:16px;box-shadow:var(--shadow);
}
.seg{
  flex:1;padding:9px 15px;display:flex;align-items:center;gap:9px;font-size:12px;
  border-right:1px solid var(--border);position:relative;cursor:default;
}
.seg:last-child{border-right:none}
.seg:hover{background:var(--panel-hi)}
.seg .k{color:var(--faint);font-size:11px}
.seg .v{font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.ok-c{color:var(--ok)} .warn-c{color:var(--warn)} .bad-c{color:var(--bad)} .info-c{color:var(--info)}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  backdrop-filter:blur(14px);box-shadow:var(--shadow);
}
.card-h{
  padding:11px 16px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}

.grid-kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;position:relative;overflow:hidden;cursor:default}
.kpi:hover{border-color:var(--border-hi)}
.kpi .lbl{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:5px}
.kpi .val{font-size:26px;font-weight:680;letter-spacing:-.6px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:13px;font-weight:500;color:var(--dim);margin-left:2px}
.kpi .foot{font-size:11px;color:var(--faint);margin-top:5px}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.kpi.k-ok::after{background:var(--ok)} .kpi.k-warn::after{background:var(--warn)}
.kpi.k-bad::after{background:var(--bad)} .kpi.k-info::after{background:var(--info)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}

/* ---------- 图表 ---------- */
/* Chart.js 需要一个确定高度的父容器：maintainAspectRatio 关掉后它自己填满 */
.chartbox{position:relative;height:290px;padding:14px 16px 12px}
.chart-fallback{height:290px;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;text-align:center;padding:0 30px;line-height:1.8}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 12px;font-size:11px;color:var(--dim)}
.legend-inline .li{display:inline-flex;align-items:center;gap:5px;cursor:default}
.legend-inline .li i{width:9px;height:9px;border-radius:3px;font-style:normal;flex-shrink:0}

/* ---------- 分布条 ---------- */
.dist{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.drow{display:flex;align-items:center;gap:11px;font-size:12px;cursor:default}
.drow .nm{width:76px;color:var(--dim);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .track{flex:1;height:7px;border-radius:99px;background:var(--track);overflow:hidden;min-width:60px}
.drow .fill{height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.drow .num{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);flex-shrink:0}

/* ---------- 表格 ---------- */
.tblwrap{overflow:visible}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;padding:9px 12px;color:var(--faint);font-weight:600;font-size:11px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:transparent;
}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-hi)}
.cell{position:relative;cursor:help}
.cell:hover{outline:1px dashed var(--border-hi);outline-offset:-1px;border-radius:3px}

.tag{
  display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;margin-right:3px;
  background:var(--track);color:var(--dim);white-space:nowrap;
  border:1px solid transparent;line-height:1.5;
}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:1px 8px 1px 7px;border-radius:99px;border:1px solid transparent}
.st i{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0;font-style:normal}
.st.s-done i{background:var(--ok)} .st.s-risk i{background:var(--bad)}
.st.s-doing i{background:var(--accent)} .st.s-pause i{background:var(--faint)}
.st.s-done{color:var(--ok)} .st.s-risk{color:var(--bad)}

.bar{display:flex;align-items:center;gap:7px;justify-content:flex-end}
.bar .t{width:44px;height:5px;border-radius:99px;background:var(--track);overflow:hidden;flex-shrink:0}
.bar .f{height:100%;border-radius:99px;background:var(--accent)}
.bar span{width:34px;text-align:right;font-variant-numeric:tabular-nums}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--dim)}

/* ---------- 字段对照 ---------- */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.fitem{padding:9px 13px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:help}
.fitem:nth-child(3n){border-right:none}
.fitem:hover{background:var(--panel-hi)}
.fitem .fn{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.fitem .ft{font-size:10px;color:var(--info);font-family:ui-monospace,monospace;padding:1px 5px;border-radius:4px;background:var(--track)}
.fitem .fv{font-size:11.5px;color:var(--dim);margin-top:3px;word-break:break-all}
.fitem .fw{font-size:10px;color:var(--warn);margin-left:auto}
.badge-w{color:var(--warn)}

/* ---------- 悬浮提示 ---------- */
#tip{
  position:fixed;z-index:999;max-width:460px;padding:10px 13px;border-radius:10px;
  background:var(--tipbg);border:1px solid var(--border-hi);box-shadow:var(--shadow);
  font-size:11.5px;line-height:1.6;pointer-events:none;opacity:0;transition:opacity .12s;
  backdrop-filter:blur(18px);color:var(--text);
}
#tip.on{opacity:1}
#tip .th{font-weight:650;margin-bottom:5px;display:flex;align-items:center;gap:7px;font-size:12px}
#tip .tr{display:flex;gap:8px;margin-top:3px}
#tip .tk{color:var(--faint);flex-shrink:0;min-width:52px}
#tip .tv{color:var(--text);word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
#tip .tv.raw{color:var(--warn)}
#tip .sep{height:1px;background:var(--border);margin:7px 0}
#tip .note{color:var(--dim);font-size:11px;margin-top:5px;font-family:inherit}

.foot{margin-top:20px;display:flex;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:11px}
.foot span{cursor:help}
.foot span:hover{color:var(--dim)}
.empty{padding:26px;text-align:center;color:var(--faint)}
@media (max-width:1320px){.grid-kpi{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  .grid-kpi{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .fitem{border-right:none}
}

/* ---------------- 写回（可编辑单元格 / 结果提示） ---------------- */
/* 查看 → 悬停；编辑 → 双击。两者不冲突，保持「不点击就能看全」的手感。 */
.cell.editable{cursor:cell;position:relative}
.cell.editable:hover{background:var(--panel-hi);box-shadow:inset 0 0 0 1px var(--border)}
.cell.editable::after{content:'✎';position:absolute;top:2px;right:4px;font-size:9px;color:var(--faint);opacity:0;transition:.15s}
.cell.editable:hover::after{opacity:.85}
.cell.saving{opacity:.5;pointer-events:none}
.cell.saved{animation:flashOk 1s ease}
.cell.failed{animation:flashBad 1s ease}
@keyframes flashOk{0%{background:rgba(31,157,104,.28)}100%{background:transparent}}
@keyframes flashBad{0%{background:rgba(220,82,82,.28)}100%{background:transparent}}
.cell select,.cell input{font:inherit;font-size:12px;width:100%;padding:2px 5px;border-radius:5px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);outline:none}
.cell input{text-align:right}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:99;
  background:var(--panel);color:var(--text);border:1px solid var(--border);
  box-shadow:0 8px 28px rgba(0,0,0,.3);transition:.22s;max-width:80vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(31,157,104,.60)}
#toast.bad{border-color:rgba(220,82,82,.65)}

/* =========================================================================
   三丽鸥橙色皮肤（Sanrio-ish orange）
   -------------------------------------------------------------------------
   只覆盖观感：圆角更圆、暖色柔光、悬停轻微上浮。不动任何交互与数据逻辑。
   颜色全部走上面的 CSS 变量，切主题时整套一起换。
   ========================================================================= */
body{font-family:"PingFang SC","Hiragino Sans GB","Yuanti SC","Microsoft YaHei UI",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
h1{font-weight:700;letter-spacing:0}
h1 .dot{display:inline-block;transform:translateY(-2px);font-size:1.15em}

.strip{border-radius:18px}
.seg{border-right-color:color-mix(in srgb,var(--accent) 14%,transparent)}
.seg .v{font-weight:700}
.seg:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}

.card{
  border-radius:18px;
  box-shadow:var(--shadow),inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{transform:translateY(-2px);border-color:var(--border-hi)}
.card-h{border-radius:18px 18px 0 0;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.card-h::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}

.kpi{padding:15px 17px}
.kpi::after{width:5px;border-radius:0 99px 99px 0}
.kpi .lbl{color:var(--dim)}
.kpi .val{letter-spacing:-.4px}

.pill{background:var(--panel-hi)}
.pill:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tbtn{
  background:color-mix(in srgb,var(--accent) 12%,var(--panel));
  color:var(--accent);font-weight:600;
  border-color:color-mix(in srgb,var(--accent) 32%,transparent);
}
.tbtn:hover{background:color-mix(in srgb,var(--accent) 20%,var(--panel));color:var(--accent);border-color:var(--accent)}

.tag,.st{border-radius:99px}
.tag{padding:1px 9px}
.drow .track,.drow .fill,.bar .t,.bar .f{border-radius:99px}
.drow .fill{box-shadow:0 1px 6px color-mix(in srgb,var(--accent) 30%,transparent)}

th{color:var(--dim)}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.fitem:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.legend-inline .li i{border-radius:50%}
#tip{border-radius:14px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1 id="t-title">项目指标看板<span class="dot">.</span></h1>
      <div class="sub" id="t-sub"></div>
    </div>
    <div class="top-right" id="t-topright"></div>
  </div>

  <div class="strip" id="t-strip"></div>

  <div class="grid-kpi" id="t-kpi"></div>

  <div class="split">
    <div class="card">
      <div class="card-h">状态分布 <span class="hint">悬停看口径</span></div>
      <div class="dist" id="t-status"></div>
    </div>
    <div class="card">
      <div class="card-h">部门分布 <span class="hint">含 lookup 拉取的在编人数</span></div>
      <div class="dist" id="t-dept"></div>
    </div>
  </div>

  <div class="split">
    <div class="card">
      <div class="card-h">项目进度折线 <span class="hint">点颜色 = 状态 · 虚线 = 平均进度</span></div>
      <div class="chartbox" id="box-progress"><canvas id="c-progress"></canvas></div>
      <div class="legend-inline" id="lg-progress"></div>
    </div>
    <div class="card">
      <div class="card-h">部门 × 状态 柱状图 <span class="hint">每段颜色 = 状态 · 悬停看明细</span></div>
      <div class="chartbox" id="box-dept"><canvas id="c-dept"></canvas></div>
      <div class="legend-inline" id="lg-dept"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h">项目明细 <span class="hint">悬停单元格 → 对照「接口原始值 / 解析后」 · 双击「状态 / 进度 / 超期」→ 写回多维表</span></div>
    <div class="tblwrap"><table id="t-table"></table></div>
  </div>

  <div class="card">
    <div class="card-h">
      字段解析对照
      <span class="hint">同一个字段，接口给了什么 vs 页面拿到了什么</span>
    </div>
    <div class="fgrid" id="t-fields"></div>
  </div>

  <div class="foot" id="t-foot"></div>
</div>

<div id="tip"></div>

let VM = VM_EMBEDDED;
/* 当前数据来自哪一层：embed=页面内联构建快照 / file=同目录 vm.json / relay=中转层实时 */

const SOURCE_INFO = {
  embed: { label: '构建快照', cls: 'info-c' },
  file:  { label: '快照文件', cls: 'warn-c' },

};
function sourceNote(src) {
  if (src === 'relay') {
    return '<div class="note">数据来自本地中转服务，打开页面即是当前值。<br>写回后刷新页面<b>不会</b>退回旧值 —— 此时页面不使用构建快照。</div>';
  }
  if (src === 'file') {
    return '<div class="note">数据来自同目录的 <code>vm.json</code>，已绕开页面缓存，但它仍是<b>上一次构建</b>的结果，不是实时值。</div>';
  }
  return '<div class="note">数据来自页面内联的<b>构建时快照</b>（构建于 ' + esc(VM.builtAt) + '）。<br>它不会自己更新：多维表改了数据，要重新构建才会反映到页面上。<br>启动本地中转服务后刷新，页面会自动切到实时数据。</div>';
}
const $ = (s) => document.querySelector(s);
const tip = $('#tip');

/* ---------------- 工具 ---------------- */
const fmtMoney = (n) => n >= 10000 ? '¥' + (n / 10000).toFixed(1) + '万' : '¥' + n.toLocaleString('zh-CN');
const fmtInt = (n) => Number(n || 0).toLocaleString('zh-CN');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* 数据新鲜度：绝不把旧数据说成新的 */
function freshness() {
  const mins = (Date.now() - new Date(VM.fetchedAt).getTime()) / 60000;
  const f = VM.freshness;
  let icon = '✅', cls = 'ok-c', label = '数据新鲜';
  if (VM.meta.degraded) { icon = '⚠️'; cls = 'warn-c'; label = '降级快照'; }
  else if (mins >= f.staleMinutes) { icon = '❌'; cls = 'bad-c'; label = '数据已过期'; }
  else if (mins >= f.warnMinutes) { icon = '🕓'; cls = 'warn-c'; label = '数据偏旧'; }
  else if (mins >= f.freshMinutes) { icon = '⏱'; cls = 'warn-c'; label = '待更新'; }
  return { icon, cls, label, mins };
}
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const h = Math.floor(mins / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}

/* ---------------- 提示框 ---------------- */
function showTip(html, ev) {
  tip.innerHTML = html;
  tip.classList.add('on');
  moveTip(ev);
}
function moveTip(ev) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 10) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 10) y = ev.clientY - h - pad;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('mousemove', (e) => { if (tip.classList.contains('on')) moveTip(e); });
document.addEventListener('scroll', hideTip, true);

function tipHTML(field, type, raw, parsed, note, extra) {
  let h = '<div class="th">' + esc(field) + '<span class="mono" style="color:var(--info)">' + esc(type) + '</span></div>';
  h += '<div class="tr"><span class="tk">接口原始</span><span class="tv raw">' + esc(raw) + '</span></div>';
  h += '<div class="tr"><span class="tk">页面解析</span><span class="tv">' + esc(parsed) + '</span></div>';
  if (extra) h += '<div class="sep"></div>' + extra;
  if (note) h += '<div class="note">' + note + '</div>';
  return h;
}

   数据没变就跳过重绘，避免 boot 时「先内联快照、后实时数据」连画两次闪烁。
   ========================================================================= */
const STATUS_ORDER = ['进行中', '已完成', '风险', '暂停'];
let charts = [];
let chartSig = '';

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function stColor(name) {
  return { '进行中': cssVar('--accent'), '已完成': cssVar('--ok'), '风险': cssVar('--bad'), '暂停': cssVar('--faint') }[name] || cssVar('--accent');
}

/* 标签调色板：10 个区分度高的暖色中间调（三丽鸥橙色系，暗/亮底上都可读），按标签名哈希取色 → 同名标签永远同色 */
const TAG_PALETTE = ['#f07d1a','#f2a03c','#e8677f','#8a5cc7','#1f9d68','#2f9fb5','#d9a03a','#d75c5c','#7fa93f','#c879b8'];
function tagColor(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) >>> 0;
  return TAG_PALETTE[h % TAG_PALETTE.length];
}
/* 标签/状态彩色胶囊的通用底色 + 描边（color-mix 随主题实时变化，切主题无需重画表格） */
function tinted(c) {
  return 'color:' + c + ';background:color-mix(in srgb,' + c + ' 16%,transparent);border-color:color-mix(in srgb,' + c + ' 38%,transparent)';
}
/* 进度档位色：<40% 红（告急）/ 40-79% 黄（推进中）/ ≥80% 绿（快成了） */
function progColor(p) {
  return p >= 0.8 ? cssVar('--ok') : p >= 0.4 ? cssVar('--warn') : cssVar('--bad');
}

/* =========================================================================
   写回：页面 →（本地中转服务）→ 多维表
   -------------------------------------------------------------------------
   页面自身不持任何凭证，只认得一个提交地址。中转层探测不到时，页面自动
   变成纯只读 —— 这也是公开页面对陌生访客的安全默认值：拿到链接只能看。
   ========================================================================= */
const RELAY = { online: false, checked: false, allow: [], rules: {} };
const EDITABLE_FIELDS = ['状态', '进度', '超期'];

async function probeRelay() {
  const W = VM.write || {};
  if (!W.enabled || !W.endpoint) { RELAY.checked = true; return; }
  try {
    const r = await fetch(W.endpoint + '/api/health', { cache: 'no-store' });
    const j = await r.json();
    RELAY.online = !!(j && j.ok);
    RELAY.allow = (j && j.allow) || W.allow || [];
    RELAY.rules = (j && j.rules) || {};
  } catch (e) {
    RELAY.online = false; // 连不上就是只读，不猜、不降级
  }
  RELAY.checked = true;
  renderStrip();
  renderTable();
}

function canEdit(field) {
  return RELAY.online && EDITABLE_FIELDS.indexOf(field) >= 0 && RELAY.allow.indexOf(field) >= 0;
}

function toast(msg, kind) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.className = 'on ' + (kind || '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 4200);
}

/** 双击单元格 → 就地变控件。查看依旧是悬停，不破坏原有手感。 */
function beginEdit(td) {
  if (td.dataset.editing || !canEdit(td.dataset.f)) return;
  const ri = +td.dataset.ri, field = td.dataset.f;
  const cell = VM.rows[ri].cells[field] || {};
  // 只有真的读到了当前值，才带 prev 去做乐观锁比对。
  // 读不到就置 null，服务端会跳过比对 —— 免得拿 0 当哨兵值误判成「被别人改过」。
  const prevKnown = field === '进度' ? (typeof cell.n === 'number') : !!cell.d;
  const prev = field === '进度' ? (prevKnown ? cell.n : null)
             : field === '超期' ? !!cell.b
             : (cell.d || '');

  td.dataset.editing = '1';
  td.dataset.prev = prev === null ? '' : String(prev);
  td.onmouseenter = null; td.onmouseleave = null;  // 编辑时不弹对照提示
  hideTip();

  let ctrl;
  if (field === '状态') {
    ctrl = document.createElement('select');
    ['进行中', '已完成', '风险', '暂停'].forEach((o) => {
      const op = document.createElement('option');
      op.value = o; op.textContent = o; if (o === prev) op.selected = true;
      ctrl.appendChild(op);
    });
  } else if (field === '进度') {
    ctrl = document.createElement('input');
    ctrl.type = 'number'; ctrl.min = '0'; ctrl.max = '100'; ctrl.step = '1';
    ctrl.value = prevKnown ? String(Math.round(prev * 100)) : '';
  } else {
    ctrl = document.createElement('select');
    [['false', '⬜ 未超期'], ['true', '✅ 已超期']].forEach((pair) => {
      const op = document.createElement('option');
      op.value = pair[0]; op.textContent = pair[1];
      if (String(!!cell.b) === pair[0]) op.selected = true;
      ctrl.appendChild(op);
    });
  }

  const readValue = () => (field === '状态' ? ctrl.value
                          : field === '进度' ? Number(ctrl.value) / 100
                          : ctrl.value === 'true');
  const finish = (commit) => {
    delete td.dataset.editing;
    if (commit) submitEdit(td, field, readValue(), prev);
    else renderTable();
  };

  ctrl.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
  if (field !== '进度') ctrl.onchange = () => finish(true);
  ctrl.onblur = () => { if (td.dataset.editing) finish(false); };

  td.innerHTML = '';
  td.appendChild(ctrl);
  ctrl.focus();
  if (ctrl.select) ctrl.select();
}

/** 提交。只有服务端确认写入并回读成功，界面才更新；任何失败都明确报错。 */
async function submitEdit(td, field, value, prev) {
  const r = VM.rows[+td.dataset.ri];
  if (!r || !r.rid) { toast('❌ 这条记录没有 recordId，无法定位，写回中止', 'bad'); renderTable(); return; }
  td.classList.add('saving');

  try {
    const res = await fetch(VM.write.endpoint + '/api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId: r.rid, field: field, value: value, prev: prev, actor: 'dashboard' }),
    });
    const j = await res.json();

    if (res.ok && j.ok) {
      // 服务端返回的是「接口里的真实值」，不是我们提交的值 —— 以它为准
      VM = j.vm;
      renderAll();
      const el = document.querySelector('#t-table .cell[data-ri="' + td.dataset.ri + '"][data-f="' + field + '"]');
      if (el) { el.classList.add('saved'); setTimeout(() => el.classList.remove('saved'), 1000); }
      const shown = field === '进度' ? Math.round(Number(j.saved) * 100) + '%'
                  : field === '超期' ? (j.saved ? '已超期' : '未超期')
                  : j.saved;
      toast('✅ 已写回多维表：' + field + ' → ' + shown, 'ok');
    } else if (j.conflict) {
      toast('⚠ ' + j.error, 'bad');
      renderTable();
    } else {
      toast('❌ ' + (j.error || '写入失败'), 'bad');
      renderTable();
    }
  } catch (e) {
    // 连不上中转层：明确失败，绝不显示成功态
    toast('❌ 连不上写回服务（' + VM.write.endpoint + '）：' + e.message, 'bad');
    renderTable();
  }
}

/* ---------------- 明细表 ---------------- */
const stCls = { '已完成': 's-done', '风险': 's-risk', '进行中': 's-doing', '暂停': 's-pause' };

  const cols = ['编号', '项目名称', '状态', '标签', '进度', '预算', '上线日期', '超期', '所属部门', '部门人数', '成本预警'];
  const head = '<thead><tr>' + cols.map((c) => {
    const num = ['进度', '预算', '部门人数'].includes(c);
    return '<th class="' + (num ? 'num' : '') + '">' + esc(c) + '</th>';
  }).join('') + '</tr></thead>';

  const rows = VM.rows.map((r, ri) => {
    const td = (name, content, cls) => {
      const cell = r.cells[name];
      const t = VM.contract.types[name] || 'text';
      const raw = cell ? cell.r : '（字段缺失）';
      const parsed = cell ? cell.d : '—';
      const note = cell && cell.w ? '该字段被 { type, value } 包装过，适配层已按内层类型解出真实值。' : '';
      const ed = canEdit(name) ? ' editable' : '';
      return '<td class="cell ' + (cls || '') + ed + '" data-ri="' + ri + '" data-f="' + esc(name) + '" data-t="' + esc(t) + '" data-raw="' + esc(raw) + '" data-p="' + esc(parsed) + '" data-note="' + esc(note) + '">' + content + '</td>';
    };
    return '<tr>' +
      td('编号', '<span class="mono">' + esc(r.id || '—') + '</span>') +
      td('项目名称', '<b>' + esc(r.name) + '</b>') +
      td('状态', '<span class="st ' + (stCls[r.status] || '') + '" style="' + tinted(stColor(r.status)) + '"><i></i>' + esc(r.status) + '</span>') +
      td('标签', (r.tags.length ? r.tags.map((t) => '<span class="tag" style="' + tinted(tagColor(t)) + '">' + esc(t) + '</span>').join('') : '—')) +
      td('进度', '<span class="bar"><span class="t"><span class="f" style="width:' + (r.progress * 100) + '%;background:' + progColor(r.progress) + '"></span></span><span style="color:' + progColor(r.progress) + ';font-weight:600">' + (r.progress * 100).toFixed(0) + '%</span></span>', 'num') +
      td('预算', fmtMoney(r.budget), 'num') +
      td('上线日期', esc(r.due) + (r.dueDays != null ? ' <span class="mono">(' + (r.dueDays >= 0 ? '+' : '') + r.dueDays + 'd)</span>' : '')) +
      td('超期', r.overdue ? '✅' : '⬜') +
      td('所属部门', esc(r.dept)) +
      td('部门人数', esc(r.deptSize || '—'), 'num') +
      td('成本预警', '<span class="' + (r.warn === '超预算' ? 'bad-c' : r.warn === '关注' ? 'warn-c' : 'ok-c') + '">' + esc(r.warn) + '</span>') +
    '</tr>';
  }).join('');

  $('#t-table').innerHTML = head + '<tbody>' + rows + '</tbody>';

  document.querySelectorAll('#t-table .cell').forEach((el) => {
    el.onmouseenter = (e) => showTip(
      tipHTML(el.dataset.f, el.dataset.t, el.dataset.raw, el.dataset.p, el.dataset.note), e);
    el.onmouseleave = hideTip;
  });

  // 写回入口：只在「中转层在线 + 字段在白名单」时才挂双击
  document.querySelectorAll('#t-table .cell.editable').forEach((el) => {
    el.ondblclick = () => beginEdit(el);
  });
}

/* ---------------- 字段解析对照 ---------------- */
function renderFields() {
  const sample = VM.rows[0];
  if (!sample) { $('#t-fields').innerHTML = '<div class="empty">没有数据</div>'; return; }
  const order = ['项目名称', '状态', '标签', '进度', '预算', '工时', '上线日期', '超期', '文档链接', '所属部门', '编号', '部门编码', '部门人数', '成本预警', '剩余天数', '标签汇总', '附件'];
  const items = order.map((name) => {
    const c = sample.cells[name];
    if (!c) return '<div class="fitem"><div class="fn">' + esc(name) + '<span class="ft">缺失</span></div><div class="fv">—</div></div>';
    const raw = c.r || 'null';
    return '<div class="fitem" data-f="' + esc(name) + '" data-t="' + esc(c.t) + '" data-raw="' + esc(raw) + '" data-p="' + esc(c.d) + '" data-w="' + (c.w || 0) + '">' +
      '<div class="fn">' + esc(name) + '<span class="ft">' + esc(c.t) + '</span>' + (c.w ? '<span class="fw">包装值</span>' : '') + '</div>' +
      '<div class="fv">' + esc(c.d || '（空）') + '</div>' +
    '</div>';
  }).join('');
  $('#t-fields').innerHTML = items;

  document.querySelectorAll('.fitem').forEach((el) => {
    el.onmouseenter = (e) => showTip(
      tipHTML(el.dataset.f, el.dataset.t, el.dataset.raw, el.dataset.p,
        el.dataset.w === '1' ? '接口把该值包成了 { type, value } 对象。若解析时不认识这层包装，这一列会整列空白且不报错。' : ''),
      e);
    el.onmouseleave = hideTip;
  });
}

/* ---------------- 页脚 ---------------- */
function renderFoot() {
  const ft = [
    ['🔗 链路 A：构建时拉取', '定时任务 → 拉取多维表 → 生成静态页面。分钟级延迟，零成本，无凭证泄露风险。'],
    ['🔒 凭证策略', '本次测试走 lark-cli 用户身份，本地不存任何 App Secret。正式上线改为自建应用 + CI Secret，密钥不进代码库。'],
    ['📐 解析适配层', 'field-adapter.js 同时兼容 base v3 列式与 bitable v1 行式返回，以及公式/查找引用的 { type, value } 包装。'],
    ['🧪 单测', 'test/field-adapter.test.js —— 53 项断言覆盖 17 类字段 & 两种返回形态，可用 node 直接运行。'],
    ['⚙️ 重建页面', 'node fetch-and-build.js    离线改样式：node fetch-and-build.js --offline'],
  ];
  $('#t-foot').innerHTML = ft.map((f, i) => '<span data-i="' + i + '">' + esc(f[0]) + '</span>').join('');
  document.querySelectorAll('#t-foot span').forEach((el) => {
    el.onmouseenter = (e) => showTip('<div class="th">' + esc(ft[+el.dataset.i][0]) + '</div><div class="note">' + esc(ft[+el.dataset.i][1]) + '</div>', e);
    el.onmouseleave = hideTip;

}

function renderAll() {
  renderTop(); renderStrip(); renderKPI(); renderDist(); renderCharts(); renderTable(); renderFields(); renderFoot();
}

/* ---------------- 启动 ----------------
   取数顺序（先实时，后兜底）：
     ① 中转层在线 → GET /api/snapshot，用实时数据
        —— 这样写回之后刷新页面不会退回旧值（页面不再依赖构建快照）
     ② 否则 GET ./vm.json?t=…，绕开托管平台的 10 分钟 HTML 缓存
     ③ 都拿不到 → 用页面内联的构建快照（file:// 本地打开、或离线查看时）
   ========================================================================= */
async function loadRealtimeData() {
  const W = VM.write || {};
  if (W.enabled && W.endpoint) {
    try {
      const r = await fetch(W.endpoint + '/api/snapshot', { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        if (j && j.ok && j.vm && j.vm.rows) { VM = j.vm; DATA_SOURCE = 'relay'; return; }
      }
    } catch (e) { /* 中转层没启动，往下走 */ }
  }
  if (location.protocol === 'file:') return; // file:// 下 fetch 相对路径必失败，直接用内联快照
  try {
    const r = await fetch('./vm.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j && j.rows) { VM = j; DATA_SOURCE = 'file'; }
    }
  } catch (e) { /* 没有 vm.json 就用内联快照 */ }
}

async function boot() {
  if (!VM) {
    document.body.innerHTML = '<div class="wrap"><div class="card"><div class="empty">数据未注入：请用 fetch-and-build.js 生成页面，而不是直接打开模板。</div></div></div>';
    return;
  }
  renderAll();                                          // 先用内联快照画出骨架，避免白屏
  await loadRealtimeData();                             // 再去取实时数据
  renderAll();
  probeRelay();                                         // 探测写回中转层：在线才开放编辑
}
boot();
</script>
